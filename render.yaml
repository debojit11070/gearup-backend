services:
  - type: web
    name: gearup-backend
    runtime: node
    rootDir: gearup-backend
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: BASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_EMAIL
        value: admin@gearup.com
      - key: ADMIN_PASSWORD
        value: Admin@12345
      - key: ADMIN_NAME
        value: GearUp Admin
